name: Update dashboard

on:
  schedule:
    - cron: "17 7 * * *"        # daily 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dashboard.txt

      - name: Install
        run: pip install -r requirements-dashboard.txt

      - name: Check secrets
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error title=Missing secret::FRED_API_KEY is not set (Settings → Secrets and variables → Actions → New repository secret)"
            exit 1
          fi

      - name: Build dashboard data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEOSHOCK_STRICT: "1"
        run: python scripts/build_dashboard_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard.json docs/data/signals.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Dashboard data $(date -u +%Y-%m-%d) [skip render]"
          git push
